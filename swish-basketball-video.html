<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SWISH BASKETBALL</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;width:100%;background:#000;overflow:hidden}
body{font-family:Arial,sans-serif;color:#fff}
#stage{position:fixed;inset:0;width:100vw;height:100vh;background:#000}
video{width:100%;height:100%;object-fit:cover;display:block}

#skipBtn{
  position:fixed;top:16px;right:16px;z-index:20;
  padding:8px 16px;border-radius:999px;border:2px solid rgba(255,255,255,.25);
  background:rgba(0,0,0,.5);color:#fff;font-size:.78rem;font-weight:900;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;
}

#startOverlay{
  position:absolute;inset:0;z-index:15;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(ellipse at center,#140800 0%,#000 70%);
}
#startOverlay.hidden{display:none}
#startBtn{
  padding:20px 44px;border-radius:999px;border:none;
  background:linear-gradient(135deg,#FF6B35,#ff8a5c);color:#fff;
  font-weight:900;font-size:1.1rem;letter-spacing:.03em;text-transform:uppercase;cursor:pointer;
  box-shadow:0 0 40px rgba(255,107,53,.6);
}

#missingNote{
  position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:10px;text-align:center;padding:32px;color:#c9b8a8;font-size:.9rem;
  background:#000;
}
</style>
</head>
<body>

<a id="skipBtn" href="swish-basketball.html">Skip →</a>

<div id="stage">
  <video id="introVideo" playsinline muted>
    <source src="shoot-swish-30.mp4" type="video/mp4">
  </video>

  <div id="missingNote">
    <div style="font-size:2rem">🏀</div>
    <div><strong>No video loaded yet</strong></div>
    <div>Drop <code>shoot-swish-30.mp4</code> in this same folder, then reload this page.</div>
  </div>

  <div id="startOverlay">
    <button id="startBtn" type="button">▶ PLAY</button>
  </div>
</div>

<script>
var video=document.getElementById("introVideo");
var startOverlay=document.getElementById("startOverlay");
var startBtn=document.getElementById("startBtn");
var missingNote=document.getElementById("missingNote");

// A single, one-time playback as part of the access flow — not the
// repeatable 3-rep visualization loop used elsewhere. The video plays
// once, then moves straight on to the game's own intro screen. Skip
// is always available too, since a returning player who's already
// seen this shouldn't be forced to sit through it every single time.
function goToIntro(){
  window.location.href='swish-basketball.html';
}

function startPlayback(){
  startOverlay.className="hidden";
  video.currentTime=0;
  video.play().catch(function(){
    // Autoplay was blocked for some reason even after a tap — don't
    // strand the player on a black screen, just move them along.
    goToIntro();
  });
}

video.addEventListener("ended",goToIntro);

video.addEventListener("error",function(){
  missingNote.style.display="flex";
  video.style.display="none";
  startOverlay.className="hidden";
});

setTimeout(function(){
  if(video.networkState===3||video.error){
    missingNote.style.display="flex";
    video.style.display="none";
    startOverlay.className="hidden";
  }
},1200);

startBtn.addEventListener("click",startPlayback);
</script>

</body>
</html>
